# 公開前に README の手順に従い、以下の 3 つを実値に置き換えてください。
backend:
  name: github
  repo: ktaisei/blog
  branch: main
  base_url: https://decap-github-oauth-proxy.mathlike-science.workers.dev
  auth_endpoint: auth

# このブログ（https://ktaisei.github.io/blog/）では /blog を残してください。
# 別のリポジトリ名にする場合は /<リポジトリ名>/images/uploads へ変更します。
media_folder: public/images/uploads
public_folder: /blog/images/uploads
publish_mode: simple

collections:
  - name: posts
    label: 記事
    folder: src/content/posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: タイトル, name: title, widget: string }
      - { label: 概要, name: description, widget: text, required: false }
      - { label: 公開日, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: タグ, name: tags, widget: list, required: false, default: [] }
      - { label: アイキャッチ画像, name: image, widget: image, required: false }
      - { label: 下書き, name: draft, widget: boolean, default: true, hint: "オンの場合、公開サイトには表示されません" }
      - { label: 本文, name: body, widget: markdown }
